[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edtech-email-verification-service"
version = "0.1.0"
description = "Typed signup service that emails learner verification links and records course delivery context."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "email-validator>=2.2,<3",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/edtech_verification"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
